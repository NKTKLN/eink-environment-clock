[platformio]
default_envs = esp32-c3-supermini

[env:esp32-c3-supermini]
platform = espressif32@^6
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
extra_scripts = pre:tools/embed_web.py

; Host unit tests for the hardware-independent modules: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<settings.c>
    +<notify.c>
    +<ui.c>
    +<epd_canvas.c>
    +<bmp.c>
    +<boot_guard.c>
    +<ha_discovery.c>
    +<ha_command.c>
    +<dns_packet.c>
    +<release.c>
    +<log_ring.c>
    +<http_guard.c>
    +<third_party/qrcodegen.c>
build_flags = -std=gnu11 -Wall -Wextra -Wno-unused-parameter -DBOOT_GUARD_HOST_TEST -lm
extra_scripts = pre:tools/native_cjson.py

; Same host tests under AddressSanitizer + UBSan: pio test -e native-asan
[env:native-asan]
extends = env:native
extra_scripts =
    pre:tools/native_cjson.py
    pre:tools/native_asan.py
